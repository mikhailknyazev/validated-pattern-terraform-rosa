# Purpose: Bind the Jenkins tag-housekeeping Pod to one IRSA-enabled service account.
# What this is not: This manifest does not grant Kubernetes or AWS permissions by itself.
# Prerequisites: An EKS OIDC provider and an IAM role carrying the companion least-privilege policy.
# Authoritative references: https://docs.aws.amazon.com/eks/latest/userguide/iam-roles-for-service-accounts.html
# Covers: apiVersion, kind, metadata
# Does: Declares one namespaced Kubernetes ServiceAccount object using the stable core API.
# Why: The Pod needs a named identity before IRSA can bind AWS role credentials to it.
# Change: A different kind or API would no longer match the Pod serviceAccountName contract.
# Trap: Metadata below is identity-bearing configuration, not a decorative label.
# Evidence: https://kubernetes.io/docs/concepts/security/service-accounts/
apiVersion: v1
kind: ServiceAccount
metadata:
  # Covers: name, namespace, annotations
  # Does: Selects the Pod identity and associates it with the pre-created IAM role used by IRSA.
  # Why: IRSA supplies short-lived AWS credentials without static access keys in Jenkins.
  # Change: Change all three placeholders to match the namespace, pod template, and role in this environment.
  # Trap: The annotation names the IAM role, not its instance profile; copying a role from another environment widens custody.
  # Evidence: https://docs.aws.amazon.com/eks/latest/userguide/iam-roles-for-service-accounts.html
  name: byo-subnet-tags
  namespace: <jenkins-namespace>
  annotations:
    eks.amazonaws.com/role-arn: <irsa-role-arn>
