# Purpose: Bind the Jenkins EKS worker to the exact cache-reading IAM role.
# What this is not: This identity authenticates to AWS, not to ROSA.
# Prerequisites: Existing EKS OIDC provider and IAM role using the sibling trust policy.
# Authoritative references:
# - https://docs.aws.amazon.com/eks/latest/userguide/iam-roles-for-service-accounts.html
# Covers: apiVersion, kind, metadata, name, namespace, annotations, eks.amazonaws.com/role-arn
# Does: Lets one namespace-scoped ServiceAccount receive temporary AWS credentials through IRSA.
# Why: The Pod needs Secrets Manager access without a static AWS key in CI variables or images.
# Change: Another namespace, ServiceAccount or role changes who can retrieve the human refresh session.
# Trap: Kubernetes permission to use this ServiceAccount is equivalent to cache-role access for this path.
# Evidence: https://docs.aws.amazon.com/eks/latest/userguide/iam-roles-for-service-accounts.html
apiVersion: v1
kind: ServiceAccount
metadata:
  name: <ci-service-account>
  namespace: <ci-namespace>
  annotations:
    eks.amazonaws.com/role-arn: <ci-irsa-role-arn>
