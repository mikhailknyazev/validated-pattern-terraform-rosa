# Purpose: Reviewed Mode B exec kubeconfig for a path that mounts static configuration.
# What this is not: This file contains no bearer, refresh token or client secret.
# Prerequisites: Replace placeholders, mount read-only, and set ROSA_AUTH_SKIP_KUBECONFIG_WRITE=1.
# Authoritative references:
# - https://kubernetes.io/docs/reference/access-authn-authz/authentication/#client-go-credential-plugins
# - https://github.com/int128/kubelogin/blob/v1.36.2/docs/setup.md
# Covers: apiVersion, kind, clusters, name, cluster, server, certificate-authority-data, contexts, context, user, current-context, users, exec, command, args, interactiveMode, provideClusterInfo
# Does: Defines one static client-go exec configuration with the refresh-token scope required for cross-job reuse.
# Why: Mode B restores a Secrets Manager archive into a job-local disk cache before client-go invokes kubelogin.
# Change: Removing offline_access prevents silent cross-job refresh and is refused by the entry point.
# Trap: Anyone able to retrieve the external token archive can act as the seeded person until Entra refuses the session.
# Evidence: https://kubernetes.io/docs/reference/access-authn-authz/authentication/#client-go-credential-plugins
apiVersion: v1
kind: Config
clusters:
- name: rosa
  cluster:
    server: https://<rosa-api-endpoint>:443
    certificate-authority-data: <base64-cluster-ca>
contexts:
- name: rosa
  context:
    cluster: rosa
    user: entra-device-code
current-context: rosa
users:
- name: entra-device-code
  user:
    exec:
      apiVersion: client.authentication.k8s.io/v1beta1
      command: kubectl
      args:
      - oidc-login
      - get-token
      - --oidc-issuer-url=https://login.microsoftonline.com/<tenant-id>/v2.0
      - --oidc-client-id=<public-client-id>
      - --oidc-extra-scope=profile
      - --oidc-extra-scope=offline_access
      - --grant-type=device-code
      - --token-cache-storage=disk
      # Cleanup removes this local copy after persistence to Secrets Manager.
      - --token-cache-dir=/tmp/rosa-oidc-cache
      interactiveMode: Never
      provideClusterInfo: false
